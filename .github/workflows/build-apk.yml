name: Build Sita Pharmacy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ionic-team/capacitor-android:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup & Build Project
        run: |
          # 1. Create Web Directory
          mkdir -p www
          cp index.html www/
          
          # 2. Setup Capacitor
          npm init -y
          npm install --save @capacitor/core @capacitor/cli @capacitor/android
          
          # 3. Initialize Config with Live Updates
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sitapharmacy.app",
            "appName": "Sita Pharmacy",
            "webDir": "www",
            "server": {
              "url": "https://sita-pharmacy.github.io/Sita-Pharmacy-/",
              "cleartext": true
            }
          }
          EOF
          
          # 4. Generate Android Project
          npx cap add android
          npx cap sync android
          
          # 5. Build Debug APK
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SitaPharmacy-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
