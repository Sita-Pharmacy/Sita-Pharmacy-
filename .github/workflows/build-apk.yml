name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Icon & Configure Live Updates
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin
          
          # 1. Create High-Resolution Sita Pharmacy App Icon
          cat << 'EOF' > icon.svg
          <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
            <rect width="1024" height="1024" rx="220" fill="#1597a4"/>
            <circle cx="512" cy="512" r="390" fill="#ffffff"/>
            <rect x="422" y="242" width="180" height="540" rx="30" fill="#439b4b"/>
            <rect x="242" y="422" width="540" height="180" rx="30" fill="#439b4b"/>
          </svg>
          EOF
          rsvg-convert -w 1024 -h 1024 icon.svg -o icon.png

          # 2. Setup Capacitor with Live URL Sync
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "Sita Pharmacy" "com.sitapharmacy.app" --web-dir .
          
          node -e '
            const fs = require("fs");
            const config = {
              appId: "com.sitapharmacy.app",
              appName: "Sita Pharmacy",
              webDir: ".",
              server: {
                url: "https://sita-pharmacy.github.io/Sita-Pharmacy-/",
                cleartext: true
              }
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          '
          
          npx cap add android
          npx capacitor-assets generate --android --iconSource icon.png
          npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SitaPharmacy-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
