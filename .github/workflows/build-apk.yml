name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize App & Setup Live Webview
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Initialize Capacitor project
          npx cap init "Sita Pharmacy" "com.sitapharmacy.app" --web-dir .
          
          # Configure Live Updates
          node -e '
            const fs = require("fs");
            const config = {
              appId: "com.sitapharmacy.app",
              appName: "Sita Pharmacy",
              webDir: ".",
              server: {
                url: "https://sita-pharmacy.github.io/Sita-Pharmacy-/",
                cleartext: true
              }
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          '
          
          npx cap add android

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SitaPharmacy-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
